name: Deploy Staging

on:
  workflow_run:
    workflows: [Build And Publish]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_STAGING_DIGEST to authorize recovery deployment
        required: true
        type: string
      source_build_run_id:
        description: Successful Build And Publish run containing the release candidate artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase-07-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Exact digest Terraform deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      ALLOW_PUBLIC_CLOUD_RUN_INVOKER: 'true'
      EXPECTED_TERRAFORM_ENV: staging
      TF_IN_AUTOMATION: 'true'
      TF_VAR_mongodb_uri_secret_version: ${{ vars.GCP_SECRET_VERSION_MONGODB_URI_STAGING }}
      TF_VAR_access_token_secret_version: ${{ vars.GCP_SECRET_VERSION_ACCESS_TOKEN_STAGING }}
      TF_VAR_auth_identity_pepper_secret_version: ${{ vars.GCP_SECRET_VERSION_AUTH_IDENTITY_PEPPER_STAGING }}
      TF_VAR_classroom_code_pepper_secret_version: ${{ vars.GCP_SECRET_VERSION_CLASSROOM_CODE_PEPPER_STAGING }}
      TF_VAR_seed_demo_password_secret_version: ${{ vars.GCP_SECRET_VERSION_SEED_DEMO_PASSWORD_STAGING }}

    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve and validate source build run
        id: trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_CONFIRMATION: ${{ inputs.confirmation }}
          MANUAL_SOURCE_RUN_ID: ${{ inputs.source_build_run_id }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$MANUAL_CONFIRMATION" = "DEPLOY_STAGING_DIGEST"
            [[ "$MANUAL_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            source_record="$RUNNER_TEMP/source-build-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MANUAL_SOURCE_RUN_ID" > "$source_record"
          else
            source_record="$GITHUB_EVENT_PATH"
          fi
          node scripts/resolve-trusted-workflow-run.mjs \
            "$source_record" \
            "Build And Publish" \
            "$GITHUB_REPOSITORY" \
            "workflow_run,workflow_dispatch" \
            "$RUNNER_TEMP/trusted-build-run.json"

      - name: Download exact release artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-candidate"
          gh run download "${{ steps.trust.outputs.source_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name phase-07-release-candidate \
            --dir "$RUNNER_TEMP/release-candidate"
          test -f "$RUNNER_TEMP/release-candidate/release/release-manifest.json"

      - name: Validate release manifest lineage
        id: release
        run: >-
          node scripts/validate-release-lineage.mjs
          "$RUNNER_TEMP/release-candidate/release/release-manifest.json"
          "$RUNNER_TEMP/trusted-build-run.json"
          "$GITHUB_REPOSITORY"

      - name: Checkout exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.release.outputs.commit_sha }}
          persist-credentials: false

      - name: Restore release evidence and install dependencies
        shell: bash
        run: |
          mkdir -p artifacts/phase-07
          cp -R "$RUNNER_TEMP/release-candidate/." artifacts/phase-07/
          npm ci
          npm run release-manifest:validate -- \
            artifacts/phase-07/release/release-manifest.json \
            --verify-files
          test "$(git rev-parse HEAD)" = "${{ steps.release.outputs.commit_sha }}"

      - name: Export exact Terraform release metadata
        shell: bash
        run: |
          {
            echo "TF_VAR_app_version=${{ steps.release.outputs.app_version }}"
            echo "TF_VAR_commit_sha=${{ steps.release.outputs.commit_sha }}"
            echo "TF_VAR_build_time=${{ steps.release.outputs.build_time }}"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_STAGING }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify registry digest and exact secret versions
        shell: bash
        run: |
          node scripts/validate-image-reference.mjs "${{ steps.release.outputs.image_ref }}"
          gcloud artifacts docker images describe "${{ steps.release.outputs.image_ref }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format='value(image_summary.digest)' >/dev/null
          gcloud secrets versions describe "$TF_VAR_mongodb_uri_secret_version" --secret ml-staging-mongodb-uri --format='value(state)' | grep -qx ENABLED
          gcloud secrets versions describe "$TF_VAR_access_token_secret_version" --secret ml-staging-access-token-secret --format='value(state)' | grep -qx ENABLED
          gcloud secrets versions describe "$TF_VAR_auth_identity_pepper_secret_version" --secret ml-staging-auth-identity-pepper --format='value(state)' | grep -qx ENABLED
          gcloud secrets versions describe "$TF_VAR_classroom_code_pepper_secret_version" --secret ml-staging-classroom-code-pepper --format='value(state)' | grep -qx ENABLED
          gcloud secrets versions describe "$TF_VAR_seed_demo_password_secret_version" --secret ml-staging-seed-demo-password --format='value(state)' | grep -qx ENABLED

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.0
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize Staging remote state
        working-directory: infrastructure/terraform/environments/staging
        run: terraform init -input=false

      - name: Capture current stable revision
        id: prior
        shell: bash
        run: |
          service="${{ vars.CLOUD_RUN_SERVICE }}"
          revision="$(gcloud run services describe "$service" --region asia-southeast1 --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          service_url="$(gcloud run services describe "$service" --region asia-southeast1 --format='value(status.url)' 2>/dev/null || true)"
          image=""
          if [ -n "$revision" ]; then
            image="$(gcloud run revisions describe "$revision" --region asia-southeast1 --format='value(spec.containers[0].image)')"
          fi
          echo "has_previous=$([ -n "$revision" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"

      - name: Create reviewed Staging deployment plan
        working-directory: infrastructure/terraform/environments/staging
        run: >-
          terraform plan -input=false -out=staging-deploy.tfplan
          -var="image_ref=${{ steps.release.outputs.image_ref }}"

      - name: Enforce deployment plan policy
        shell: bash
        run: |
          mkdir -p artifacts/phase-07/terraform
          terraform -chdir=infrastructure/terraform/environments/staging show -json staging-deploy.tfplan \
            > artifacts/phase-07/terraform/staging-deploy-plan.json
          TF_SECRET_CANARY="PHASE_07_STATE_CANARY_DO_NOT_STORE" \
            node scripts/check-terraform-plan.mjs \
            artifacts/phase-07/terraform/staging-deploy-plan.json \
            artifacts/phase-07/terraform/staging-deploy-plan-policy.json
          rm artifacts/phase-07/terraform/staging-deploy-plan.json

      - name: Apply exact reviewed plan
        id: apply
        working-directory: infrastructure/terraform/environments/staging
        run: terraform apply -input=false -auto-approve staging-deploy.tfplan

      - name: Capture deployed service outputs
        id: outputs
        working-directory: infrastructure/terraform/environments/staging
        shell: bash
        run: |
          service_url="$(terraform output -raw cloud_run_service_uri)"
          canonical_url="$(terraform output -raw canonical_service_uri)"
          revision="$(terraform output -raw cloud_run_latest_ready_revision)"
          seed_job="$(terraform output -raw seed_job_name)"
          test "$service_url" = "$canonical_url"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "seed_job=$seed_job" >> "$GITHUB_OUTPUT"

      - name: Seed idempotent synthetic Staging fixtures
        shell: bash
        run: >-
          gcloud run jobs execute "${{ steps.outputs.outputs.seed_job }}"
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region asia-southeast1
          --wait
          --quiet

      - name: Run exact-release HTTPS smoke
        run: >-
          node scripts/verify-staging-deployment.mjs
          "${{ steps.outputs.outputs.service_url }}"
          "${{ steps.release.outputs.app_version }}"
          "${{ steps.release.outputs.commit_sha }}"
          "${{ steps.release.outputs.image_ref }}"
          artifacts/phase-07/staging/deployment-smoke.json

      - name: Verify post-apply drift is empty
        working-directory: infrastructure/terraform/environments/staging
        run: >-
          terraform plan -input=false -detailed-exitcode
          -var="image_ref=${{ steps.release.outputs.image_ref }}"

      - name: Create candidate deployment record
        run: >-
          npm run deployment-record:create --
          artifacts/phase-07/release/release-manifest.json
          "${{ steps.outputs.outputs.service_url }}"
          "${{ steps.outputs.outputs.revision }}"
          "${{ steps.outputs.outputs.seed_job }}"
          "${{ steps.prior.outputs.revision }}"
          "${{ steps.prior.outputs.image }}"
          artifacts/phase-07/staging/deployment-record.json

      - name: Roll back traffic after a post-apply failure
        if: failure() && steps.apply.outcome == 'success' && steps.prior.outputs.has_previous == 'true'
        shell: bash
        run: |
          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region asia-southeast1 \
            --to-revisions "${{ steps.prior.outputs.revision }}=100"
          curl --fail --silent --show-error --max-time 20 \
            "${{ steps.prior.outputs.service_url }}/ready" \
            >/dev/null
          mkdir -p artifacts/phase-07/staging
          jq -n \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg revision "${{ steps.prior.outputs.revision }}" \
            --arg image "${{ steps.prior.outputs.image }}" \
            '{schemaVersion:1,environment:"staging",rolledBackAt:$at,restoredRevision:$revision,restoredImage:$image,decision:"ROLLED_BACK",reason:"POST_APPLY_GATE_FAILURE"}' \
            > artifacts/phase-07/staging/rollback-record.json

      - name: Upload deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-07-staging-deployment
          path: |
            artifacts/phase-07/staging
            artifacts/phase-07/terraform/staging-deploy-plan-policy.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Phase 07 Staging candidate"
            echo "- Revision: \`${{ steps.outputs.outputs.revision }}\`"
            echo "- Image: \`${{ steps.release.outputs.image_ref }}\`"
            echo "- State: \`DEPLOYED_PENDING_CLOUD_E2E\`"
          } >> "$GITHUB_STEP_SUMMARY"
