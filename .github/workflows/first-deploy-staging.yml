name: First Deploy Staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_STAGING to authorize the first Terraform apply
        required: true
        type: string
      image_ref:
        description: Exact scanned Artifact Registry image reference ending in @sha256 digest
        required: true
        type: string
      app_version:
        description: Semantic version from the release manifest
        required: true
        type: string
      build_time:
        description: ISO-8601 UTC build timestamp from the release manifest
        required: true
        type: string
      observation_minutes:
        description: Post-deploy health observation window
        required: true
        default: 15
        type: number

permissions:
  contents: read

concurrency:
  group: phase-07-first-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: First Staging Terraform apply
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      ALLOW_PUBLIC_CLOUD_RUN_INVOKER: 'true'
      EXPECTED_TERRAFORM_ENV: staging
      TF_IN_AUTOMATION: 'true'
      TF_VAR_app_version: ${{ inputs.app_version }}
      TF_VAR_commit_sha: ${{ github.sha }}
      TF_VAR_build_time: ${{ inputs.build_time }}
      TF_VAR_mongodb_uri_secret_version: ${{ vars.GCP_SECRET_VERSION_MONGODB_URI_STAGING }}
      TF_VAR_access_token_secret_version: ${{ vars.GCP_SECRET_VERSION_ACCESS_TOKEN_STAGING }}
      TF_VAR_auth_identity_pepper_secret_version: ${{ vars.GCP_SECRET_VERSION_AUTH_IDENTITY_PEPPER_STAGING }}
      TF_VAR_classroom_code_pepper_secret_version: ${{ vars.GCP_SECRET_VERSION_CLASSROOM_CODE_PEPPER_STAGING }}
      TF_VAR_seed_demo_password_secret_version: ${{ vars.GCP_SECRET_VERSION_SEED_DEMO_PASSWORD_STAGING }}

    steps:
      - name: Validate protected deployment inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          IMAGE_REF: ${{ inputs.image_ref }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          DEPLOYER_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_STAGING }}
        run: |
          test "$CONFIRMATION" = "DEPLOY_STAGING"
          test -n "$IMAGE_REF"
          test -n "$GCP_PROJECT_ID"
          test -n "$WIF_PROVIDER"
          test -n "$DEPLOYER_ACCOUNT"
          test "${{ inputs.observation_minutes }}" -ge 1
          test "${{ inputs.observation_minutes }}" -le 30
          for version in \
            "$TF_VAR_mongodb_uri_secret_version" \
            "$TF_VAR_access_token_secret_version" \
            "$TF_VAR_auth_identity_pepper_secret_version" \
            "$TF_VAR_classroom_code_pepper_secret_version" \
            "$TF_VAR_seed_demo_password_secret_version"; do
            [[ "$version" =~ ^[1-9][0-9]*$ ]]
          done

      - name: Checkout trusted main source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate image and runtime configuration contracts
        run: |
          node scripts/validate-image-reference.mjs "${{ inputs.image_ref }}"
          npm run verify:runtime-config

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_STAGING }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify image and exact secret versions exist
        shell: bash
        run: |
          gcloud artifacts docker images describe "${{ inputs.image_ref }}" --project "${{ vars.GCP_PROJECT_ID }}" --format='value(image_summary.digest)' >/dev/null
          gcloud secrets versions describe "$TF_VAR_mongodb_uri_secret_version" --secret ml-staging-mongodb-uri --project "${{ vars.GCP_PROJECT_ID }}" --format='value(state)' | grep -qx ENABLED
          gcloud secrets versions describe "$TF_VAR_access_token_secret_version" --secret ml-staging-access-token-secret --project "${{ vars.GCP_PROJECT_ID }}" --format='value(state)' | grep -qx ENABLED
          gcloud secrets versions describe "$TF_VAR_auth_identity_pepper_secret_version" --secret ml-staging-auth-identity-pepper --project "${{ vars.GCP_PROJECT_ID }}" --format='value(state)' | grep -qx ENABLED
          gcloud secrets versions describe "$TF_VAR_classroom_code_pepper_secret_version" --secret ml-staging-classroom-code-pepper --project "${{ vars.GCP_PROJECT_ID }}" --format='value(state)' | grep -qx ENABLED
          gcloud secrets versions describe "$TF_VAR_seed_demo_password_secret_version" --secret ml-staging-seed-demo-password --project "${{ vars.GCP_PROJECT_ID }}" --format='value(state)' | grep -qx ENABLED

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.0
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize Staging remote state
        working-directory: infrastructure/terraform/environments/staging
        run: terraform init -input=false

      - name: Plan private seed/index bootstrap
        working-directory: infrastructure/terraform/environments/staging
        run: >-
          terraform plan -input=false -out=seed-bootstrap.tfplan
          -var="image_ref=${{ inputs.image_ref }}"
          -var="provision_service=false"

      - name: Enforce seed bootstrap plan policy
        shell: bash
        run: |
          mkdir -p artifacts/phase-07/terraform
          terraform -chdir=infrastructure/terraform/environments/staging show -json seed-bootstrap.tfplan > artifacts/phase-07/terraform/seed-bootstrap-plan.json
          TF_SECRET_CANARY="PHASE_07_STATE_CANARY_DO_NOT_STORE" node scripts/check-terraform-plan.mjs artifacts/phase-07/terraform/seed-bootstrap-plan.json artifacts/phase-07/terraform/seed-bootstrap-plan-policy.json
          rm artifacts/phase-07/terraform/seed-bootstrap-plan.json

      - name: Apply private seed/index bootstrap plan
        working-directory: infrastructure/terraform/environments/staging
        run: terraform apply -input=false -auto-approve seed-bootstrap.tfplan

      - name: Capture private seed job name
        id: seed
        working-directory: infrastructure/terraform/environments/staging
        run: echo "job=$(terraform output -raw seed_job_name)" >> "$GITHUB_OUTPUT"

      - name: Execute private idempotent seed and index job
        run: >-
          gcloud run jobs execute "${{ steps.seed.outputs.job }}"
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region asia-southeast1
          --wait

      - name: Plan public Staging service after seed success
        working-directory: infrastructure/terraform/environments/staging
        run: terraform plan -input=false -out=service.tfplan -var="image_ref=${{ inputs.image_ref }}"

      - name: Enforce final service plan policy
        shell: bash
        run: |
          terraform -chdir=infrastructure/terraform/environments/staging show -json service.tfplan > artifacts/phase-07/terraform/first-deploy-plan.json
          TF_SECRET_CANARY="PHASE_07_STATE_CANARY_DO_NOT_STORE" node scripts/check-terraform-plan.mjs artifacts/phase-07/terraform/first-deploy-plan.json artifacts/phase-07/terraform/first-deploy-plan-policy.json
          rm artifacts/phase-07/terraform/first-deploy-plan.json

      - name: Apply the exact reviewed service plan
        working-directory: infrastructure/terraform/environments/staging
        run: terraform apply -input=false -auto-approve service.tfplan

      - name: Capture safe Terraform outputs
        id: outputs
        shell: bash
        working-directory: infrastructure/terraform/environments/staging
        run: |
          service_url="$(terraform output -raw cloud_run_service_uri)"
          canonical_url="$(terraform output -raw canonical_service_uri)"
          revision="$(terraform output -raw cloud_run_latest_ready_revision)"
          seed_job="$(terraform output -raw seed_job_name)"
          test "$service_url" = "$canonical_url"
          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "seed_job=$seed_job" >> "$GITHUB_OUTPUT"

      - name: Run first-deploy HTTPS smoke
        run: >-
          node scripts/verify-staging-deployment.mjs
          "${{ steps.outputs.outputs.service_url }}"
          "${{ inputs.app_version }}"
          "${{ github.sha }}"
          "${{ inputs.image_ref }}"
          artifacts/phase-07/staging/first-deploy-smoke.json

      - name: Observe stable readiness
        shell: bash
        run: |
          for minute in $(seq 1 "${{ inputs.observation_minutes }}"); do
            curl --fail --silent --show-error --max-time 15 "${{ steps.outputs.outputs.service_url }}/ready" >/dev/null
            echo "Observation minute $minute passed"
            sleep 60
          done

      - name: Verify post-apply drift is empty
        shell: bash
        working-directory: infrastructure/terraform/environments/staging
        run: terraform plan -input=false -detailed-exitcode -var="image_ref=${{ inputs.image_ref }}"

      - name: Create redacted deployment record
        shell: bash
        run: |
          mkdir -p artifacts/phase-07/staging
          jq -n \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "${{ github.sha }}" \
            --arg image "${{ inputs.image_ref }}" \
            --arg service_url "${{ steps.outputs.outputs.service_url }}" \
            --arg revision "${{ steps.outputs.outputs.revision }}" \
            --arg seed_job "${{ steps.outputs.outputs.seed_job }}" \
            --arg mongo_version "$TF_VAR_mongodb_uri_secret_version" \
            --arg access_version "$TF_VAR_access_token_secret_version" \
            --arg auth_version "$TF_VAR_auth_identity_pepper_secret_version" \
            --arg classroom_version "$TF_VAR_classroom_code_pepper_secret_version" \
            --arg seed_version "$TF_VAR_seed_demo_password_secret_version" \
            '{schemaVersion:1,completedAt:$completed_at,environment:"staging",commitSha:$commit,imageRef:$image,serviceUrl:$service_url,revision:$revision,seedJob:$seed_job,secretVersions:{mongodbUri:$mongo_version,accessToken:$access_version,authIdentityPepper:$auth_version,classroomCodePepper:$classroom_version,seedDemoPassword:$seed_version},decision:"PASS"}' \
            > artifacts/phase-07/staging/deployment-record.json

      - name: Upload first-deploy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-07-first-deploy-staging
          path: |
            artifacts/phase-07/terraform/seed-bootstrap-plan-policy.json
            artifacts/phase-07/terraform/first-deploy-plan-policy.json
            artifacts/phase-07/staging
          if-no-files-found: warn
          retention-days: 30
