name: Phase 07 Hardening

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-07-hardening
  cancel-in-progress: false

jobs:
  hardening:
    name: Clean-clone hardening and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full clean-clone quality gate
        run: npm run check:ci

      - name: Run Terraform validation and security gates
        run: npm run terraform:check

      - name: Run hardening contract
        run: npm run hardening:contract:test

      - name: Audit production dependency closure
        run: npm run audit:production

      - name: Build and inspect production image
        run: |
          npm run container:build -- microlearning-platform:phase-07-hardening
          npm run container:verify -- microlearning-platform:phase-07-hardening
          npm run container:scan -- microlearning-platform:phase-07-hardening
          npm run sbom:production -- microlearning-platform:phase-07-hardening

      - name: Upload hardening evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-07-hardening
          path: |
            artifacts/phase-07
            artifacts/sbom
          if-no-files-found: warn
          retention-days: 30

      - name: Publish hardening summary
        if: always()
        run: |
          {
            echo "## Phase 07 hardening"
            echo "- Clean checkout: `true`"
            echo "- Production apply: `false`"
            echo "- Cloud deployment evidence: `REMOTE_CLOUD_PENDING` until Staging CD and Cloud E2E are run"
          } >> "$GITHUB_STEP_SUMMARY"
