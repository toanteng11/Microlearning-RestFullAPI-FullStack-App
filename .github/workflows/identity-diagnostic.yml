name: Identity Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorized-staging-identity:
    name: Authorized Staging identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate required repository variables
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          DEPLOYER_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_STAGING }}
        run: |
          test -n "$GCP_PROJECT_ID"
          test -n "$WIF_PROVIDER"
          test -n "$DEPLOYER_ACCOUNT"

      - name: Checkout trusted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Authenticate using short-lived OIDC credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_STAGING }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Verify project, no-key policy and role boundaries
        run: >-
          node scripts/verify-gcp-identity.mjs
          --project=${{ vars.GCP_PROJECT_ID }}
          --deployer=${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_STAGING }}
          --runtime=ml-runtime-staging@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          --account=ml-runtime-staging@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          --account=ml-seed-staging@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          --account=ml-e2e-staging@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          --account=${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT_STAGING }}

      - name: Upload sanitized identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-07-authorized-identity-diagnostic
          path: artifacts/phase-07/identity/identity-diagnostic.json
          if-no-files-found: error
          retention-days: 14
